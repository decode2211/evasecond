
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eva2
    ports:
      # Host port 5433 (not the default 5432) to avoid clashing with any
      # Postgres already installed/running natively on the host machine.
      - "5433:5432"
    volumes:
      - eva2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  eva2_postgres_data:
